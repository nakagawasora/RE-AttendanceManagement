<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .modal-backdrop-lite {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal-backdrop-confirm { z-index: 1500; }
      .modal-backdrop-lite.is-open { display: flex; }
      .modal-panel {
        width: min(1160px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        background: #fff;
        border-radius: 6px;
        padding: 24px;
      }
      .modal-title-lite {
        text-align: center;
        margin-bottom: 20px;
      }
      .modal-body-wide {
        width: 100%;
        margin: 0 auto;
      }
      .modal-body-balanced {
        width: min(920px, 100%);
        margin: 0 auto;
      }
      .modal-body-form {
        width: min(980px, 100%);
        margin: 0 auto;
      }
      .transfer-pane { min-height: 320px; }
      .admin-shell {
        width: 80%;
        margin: 0 auto;
      }
      .admin-section {
        padding: 20px 0 28px;
        border-top: 1px solid #e9ecef;
      }
      .admin-section h4 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 16px;
      }
      .admin-subhead {
        font-size: .95rem;
        font-weight: 700;
        color: #495057;
        margin: 12px 0;
      }
      .admin-table {
        table-layout: fixed;
        border-color: #edf0f2;
      }
      .admin-table thead th {
        color: #6c757d;
        font-size: .78rem;
        font-weight: 700;
        letter-spacing: .02em;
        background: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
      }
      .admin-table tbody td {
        background: #fff;
      }
      .admin-table .cell-long {
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .table th, .table td {
        text-align: left;
        vertical-align: middle;
      }
      .admin-actions {
        display: flex;
        justify-content: flex-start;
        gap: 8px;
        flex-wrap: wrap;
      }
      .admin-form {
        display: inline-block;
        margin: 0;
      }
      .admin-form-full {
        display: block;
        width: 100%;
      }
      .action-btn {
        min-width: 112px;
        white-space: nowrap;
      }
      .action-btn-sm {
        min-width: 84px;
        white-space: nowrap;
      }
      .admin-message {
        min-height: 24px;
      }
      .loading-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(255,255,255,.72);
        z-index: 2000;
      }
      .loading-overlay.is-open { display: flex; }
      .spinner-lite {
        width: 42px;
        height: 42px;
        border: 4px solid #ced4da;
        border-top-color: #0d6efd;
        border-radius: 50%;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <h2 class="my-4">勤怠管理</h2>
      <?!= message ?>
      <div id="adminMessage" class="admin-message text-danger mb-3"></div>
      <div class="mb-4">ログイン中: <?= activeEmail || '取得できません' ?></div>

      <? if (authed) { ?>
      <div id="app"></div>
      <div id="modal" class="modal-backdrop-lite"></div>
      <div id="confirmModal" class="modal-backdrop-lite modal-backdrop-confirm"></div>
      <div id="loadingOverlay" class="loading-overlay"><div class="spinner-lite" aria-label="処理中"></div></div>
      <? } else { ?>
      <p class="text-danger">このGoogleアカウントは管理画面の利用を許可されていません。</p>
      <? } ?>
    </div>

    <? if (authed) { ?>
    <script>
      let snapshot = <?!= snapshotJson ?>;
      const app = document.getElementById('app');
      const modal = document.getElementById('modal');
      const confirmModal = document.getElementById('confirmModal');
      const loadingOverlay = document.getElementById('loadingOverlay');
      let pendingAdminParams = null;
      const NO_ASSIGNED_USERS = '__NONE__';

      renderAdminApp();

      function normalizeSnapshot() {
        snapshot = snapshot || {};
        snapshot.activeUsers = snapshot.activeUsers || [];
        snapshot.projects = snapshot.projects || [];
        snapshot.wageUpgrades = snapshot.wageUpgrades || [];
        snapshot.roleAllowances = snapshot.roleAllowances || [];
        snapshot.adminWhitelist = snapshot.adminWhitelist || [];
        snapshot.latestBillReaction = snapshot.latestBillReaction || { message: '未取得', unreactedUsers: [] };
        snapshot.latestBillReaction.unreactedUsers = snapshot.latestBillReaction.unreactedUsers || [];
        snapshot.adminExecutionLogs = snapshot.adminExecutionLogs || [];
      }

      function renderAdminApp() {
        normalizeSnapshot();
        app.innerHTML = `
        ${section('一括操作', `
          <div class="mb-3">
            ${periodForm('setBillForPeriod', '一括発行')}
          </div>
          <div class="mb-3">
            <div class="d-flex align-items-center gap-3">
              <div>最新まとめ投稿日時: ${esc(formatSlackTs(snapshot.latestBillReaction.messageTs) || snapshot.latestBillReaction.message || '')}</div>
              <button class="btn btn-sm btn-outline-secondary action-btn" type="button" onclick="refreshLatestBillReaction()">更新</button>
            </div>
            <h6 class="mt-3">未リアクションユーザー一覧</h6>
            <div class="mb-2">
              <button class="btn btn-sm btn-outline-primary action-btn" type="button" onclick="bulkRemindSelectedUsers()">選択ユーザーへ催促</button>
              <button class="btn btn-sm btn-outline-primary action-btn" type="button" onclick="bulkRemindAllUsers()">全員へ催促</button>
            </div>
            ${table(['','ID','名前','SlackID','操作'], snapshot.latestBillReaction.unreactedUsers.map(user => [
              `<input type="checkbox" class="bulk-remind-check" value="${esc(user.slackUserId)}">`,
              user.id,
              user.name,
              user.slackUserId,
              actionGroup(postForm(`<input type="hidden" name="action" value="remindUnreactedUser"><input type="hidden" name="slackUserId" value="${esc(user.slackUserId)}"><button class="btn btn-sm btn-outline-primary action-btn-sm">催促通知</button>`))
            ]), 'bulk')}
          </div>
          <div class="d-flex flex-wrap gap-3">
            ${periodForm('gatherBillsForPeriod', '一括回収')}
          </div>
          <h6 class="mt-4">一括処理ログ</h6>
          ${table(['日時','処理','対象','結果','詳細'], snapshot.adminExecutionLogs.map(log => [
            log.timestamp,
            log.action,
            log.period,
            log.status,
            log.message
          ]), 'standard')}
        `)}
        ${section('ユーザー', `
          ${table(['ID','名前','Email','SlackID','操作'], snapshot.activeUsers.map(user => [
            user.id, user.name, user.email, user.slackUserId,
            actionGroup(`<button class="btn btn-sm btn-outline-secondary action-btn-sm" type="button" onclick="openUserNameModal('${escAttr(user.id)}')">名前編集</button>${periodForm('resetBillForPeriod', '再発行', `<input type="hidden" name="attendanceSheetId" value="${esc(user.attendanceSheetId)}">`, 'btn-sm btn-outline-primary action-btn-sm')}${postForm(`<input type="hidden" name="action" value="deleteUser"><input type="hidden" name="userId" value="${esc(user.id)}"><button class="btn btn-sm btn-outline-danger action-btn-sm">論理削除</button>`)}`)
          ]), 'standard')}
        `)}
        ${section('PJ', `
          <h5 class="admin-subhead">有効PJ</h5>
          <div class="mb-2">
            <button class="btn btn-sm btn-outline-danger action-btn" type="button" onclick="bulkUpdateSelectedProjects(false)">選択PJを無効化</button>
          </div>
          ${projectTable(snapshot.projects.filter(project => project.activeInterpreted === '有効'), true)}
          ${postForm(`
            <input type="hidden" name="action" value="addProject">
            <div class="row g-2">
              ${input('projectName','PJ名')}
              ${input('hourlyWage','時給','number')}
              <div class="col-auto align-self-end"><button class="btn btn-primary">PJ追加</button></div>
            </div>
          `)}
          <div class="mt-4">
            <button class="btn btn-outline-secondary action-btn" type="button" onclick="togglePeriod('inactiveProjects')">無効PJ▼</button>
            <div id="inactiveProjects" class="d-none mt-3">
              <div class="mb-2">
                <button class="btn btn-sm btn-success action-btn" type="button" onclick="bulkUpdateSelectedProjects(true)">選択PJを有効化</button>
              </div>
              ${projectTable(snapshot.projects.filter(project => project.activeInterpreted !== '有効'), false)}
            </div>
          </div>
        `)}
        ${section('時給増分', `
          ${wageUpgradeTable()}
        `)}
        ${section('役職手当', `
          ${roleAllowanceTable()}
          ${postForm(`
            <input type="hidden" name="action" value="addRoleAllowance">
            <div class="d-flex flex-nowrap gap-2 align-items-end">
              ${input('allowanceName','手当名','text','','flex-fill')}
              ${userSelect('userId', '', '対象ユーザー', 'flex-fill')}
              ${input('price','単価','number','','flex-fill')}
              <div><button class="btn btn-primary action-btn">追加</button></div>
            </div>
          `)}
        `)}
        ${section('管理者', `
          ${adminWhitelistTable()}
          ${postForm(`
            <input type="hidden" name="action" value="addAdminWhitelistEntry">
            <div class="d-flex flex-nowrap gap-2 align-items-end">
              ${input('email','Email','email','','flex-fill')}
              ${input('memo','メモ','text','','flex-fill')}
              <div><button class="btn btn-primary action-btn">追加</button></div>
            </div>
          `)}
        `)}
      `;
      }

      function periodForm(action, label, extra = '', buttonClass = 'btn-outline-primary') {
        const id = `${action}_${Math.random().toString(36).slice(2)}`;
        const maxMonth = previousMonthValue();
        return postForm(`
          <input type="hidden" name="action" value="${action}">
          ${extra}
          <div class="btn-group" role="group">
            <button class="btn ${buttonClass} action-btn" type="submit">${label}</button>
            <button class="btn ${buttonClass}" type="button" onclick="togglePeriod('${id}')">年月▼</button>
          </div>
          <div id="${id}" class="d-none mt-2">
            <input class="form-control form-control-sm" type="month" name="aggregationPeriod" max="${maxMonth}">
          </div>
        `);
      }

      function projectTable(projects, isActiveList) {
        return table(['','ID','PJ名','時給','割当','操作'], projects.map(project => [
          `<input type="checkbox" class="bulk-project-check" data-active-list="${isActiveList ? 'true' : 'false'}" value="${esc(project.id)}">`,
          project.id,
          project.name,
          project.hourlyWage,
          assignmentCell(project),
          actionGroup(`
            <button class="btn btn-sm btn-outline-primary action-btn-sm" type="button" onclick="openAssignmentModal('${escAttr(project.id)}')">割当編集</button>
            ${postForm(`<input type="hidden" name="action" value="updateProject"><input type="hidden" name="projectId" value="${esc(project.id)}"><input type="hidden" name="assignedUserIds" value="${esc(project.assignedUserIds || '')}"><input type="hidden" name="active" value="${isActiveList ? 'false' : 'true'}"><button class="btn btn-sm ${isActiveList ? 'btn-outline-danger' : 'btn-success'} action-btn-sm">${isActiveList ? '無効化' : '有効化'}</button>`)}
          `)
        ]), 'bulk');
      }

      function wageUpgradeTable() {
        const users = snapshot.activeUsers || [];
        const rows = [];
        users.forEach(user => {
          const upgrades = snapshot.wageUpgrades.filter(upgrade => String(upgrade.userId) === String(user.id));
          const userRows = (upgrades.length ? upgrades : [{ userId: user.id, projectId: '', increment: '' }]).slice().sort((a, b) => {
            const diff = Number(a.increment || 0) - Number(b.increment || 0);
            if (diff !== 0) return diff;
            return String(a.projectId || '').localeCompare(String(b.projectId || ''));
          });
          userRows.forEach((upgrade, index) => {
            const project = snapshot.projects.find(item => String(item.id) === String(upgrade.projectId)) || {};
            const sameIncrementPrev = index > 0 && String(userRows[index - 1].increment || '') === String(upgrade.increment || '');
            let incrementSpan = 1;
            if (!sameIncrementPrev) {
              for (let j = index + 1; j < userRows.length; j++) {
                if (String(userRows[j].increment || '') !== String(upgrade.increment || '')) break;
                incrementSpan++;
              }
            }
            rows.push(`<tr>
              ${index === 0 ? `<td rowspan="${userRows.length}">${esc(user.id)}</td><td rowspan="${userRows.length}">${esc(user.name)}</td>` : ''}
              ${sameIncrementPrev ? '' : `<td rowspan="${incrementSpan}">${esc(upgrade.increment || '')}</td>`}
              <td>${esc(projectLabel(project))}</td>
              ${index === 0 ? `<td rowspan="${userRows.length}"><button class="btn btn-sm btn-outline-primary action-btn" type="button" onclick="openWageModal('${escAttr(user.id)}')">編集</button></td>` : ''}
            </tr>`);
          });
        });
        return `<div class="table-responsive"><table class="table table-sm table-striped admin-table"><colgroup>${colGroup('standard', 5)}</colgroup><thead><tr><th>ユーザーID</th><th>名前</th><th>増分</th><th>対象PJ</th><th>操作</th></tr></thead><tbody>${rows.join('') || '<tr><td colspan="5">データがありません</td></tr>'}</tbody></table></div>`;
      }

      function roleAllowanceTable() {
        return table(['ID','手当名','対象ユーザー','単価','操作'], (snapshot.roleAllowances || []).map(row => [
          row.id,
          row.name,
          userLabelById(row.userId),
          row.price,
          actionGroup(`
            <button class="btn btn-sm btn-outline-primary action-btn-sm" type="button" onclick="openRoleModal('${escAttr(row.id)}')">編集</button>
            ${postForm(`<input type="hidden" name="action" value="deleteRoleAllowance"><input type="hidden" name="allowanceId" value="${esc(row.id)}"><button class="btn btn-sm btn-outline-danger action-btn-sm">論理削除</button>`)}
          `)
        ]), 'standard');
      }

      function adminWhitelistTable() {
        return table(['Email','状態','メモ','操作'], (snapshot.adminWhitelist || []).map(row => [
          `<span class="cell-long">${esc(row.email)}</span>`,
          row.active ? '有効' : '無効',
          row.memo || '',
          actionGroup(`
            <button class="btn btn-sm btn-outline-primary action-btn-sm" type="button" onclick="openAdminWhitelistModal('${escAttr(row.email)}')">編集</button>
            ${postForm(`<input type="hidden" name="action" value="updateAdminWhitelistEntry"><input type="hidden" name="email" value="${esc(row.email)}"><input type="hidden" name="memo" value="${esc(row.memo || '')}"><input type="hidden" name="active" value="${row.active ? 'false' : 'true'}"><button class="btn btn-sm ${row.active ? 'btn-outline-danger' : 'btn-success'} action-btn-sm">${row.active ? '無効化' : '有効化'}</button>`)}
            ${postForm(`<input type="hidden" name="action" value="deleteAdminWhitelistEntry"><input type="hidden" name="email" value="${esc(row.email)}"><button class="btn btn-sm btn-outline-danger action-btn-sm">削除</button>`)}
          `)
        ]), 'adminWhitelist');
      }

      function openAdminWhitelistModal(email) {
        const row = (snapshot.adminWhitelist || []).find(item => normalizeEmail(item.email) === normalizeEmail(email));
        openModal(`
          <div class="modal-body-form">
            <h5 class="modal-title-lite">管理者編集</h5>
            ${postForm(`
              <input type="hidden" name="action" value="updateAdminWhitelistEntry">
              <input type="hidden" name="email" value="${esc(row.email)}">
              <div class="row g-3 justify-content-center">
                <div class="col-md-7"><label class="form-label">Email</label><input class="form-control" value="${esc(row.email)}" disabled></div>
                <div class="col-md-5"><label class="form-label">状態</label><select class="form-select" name="active"><option value="true" ${row.active ? 'selected' : ''}>有効</option><option value="false" ${row.active ? '' : 'selected'}>無効</option></select></div>
                ${input('memo','メモ','text', row.memo || '', 'col-md-12')}
              </div>
              <div class="d-flex justify-content-between mt-4"><button class="btn btn-outline-secondary action-btn" type="button" onclick="closeModal()">キャンセル</button><button class="btn btn-primary action-btn">保存</button></div>
            `, 'admin-form-full')}
          </div>
        `);
      }

      function assignmentCell(project) {
        const summary = project.assignedSummary || project.assignedInterpreted || '全員';
        const detail = project.assignedDetail || project.assignedInterpreted || summary;
        return `<span title="${escAttr(detail)}">${esc(summary)}</span>`;
      }

      function openAssignmentModal(projectId) {
        const project = snapshot.projects.find(item => String(item.id) === String(projectId));
        const assignedIds = new Set(String(project.assignedUserIds || '').split(',').map(value => value.trim()).filter(Boolean));
        const allAssigned = assignedIds.size === 0;
        const unassigned = allAssigned ? [] : snapshot.activeUsers.filter(user => !assignedIds.has(String(user.id)));
        const assigned = allAssigned ? snapshot.activeUsers.slice() : snapshot.activeUsers.filter(user => assignedIds.has(String(user.id)));
        openModal(`
          <div class="modal-body-wide">
            <h5 class="modal-title-lite">割当編集: ${esc(project.name)}</h5>
            ${postForm(`
              <input type="hidden" name="action" value="updateProjectAssignments">
              <input type="hidden" name="projectId" value="${esc(project.id)}">
              <input type="hidden" name="originalAssignedUserIds" value="${esc(normalizeAssignedUserIds(project.assignedUserIds || ''))}">
              <input type="hidden" id="assignedUserIds" name="assignedUserIds" value="${esc(project.assignedUserIds || '')}">
              <div class="row align-items-stretch justify-content-center g-4">
                <div class="col-lg-5">${userSelectTable('unassignedUsers', unassigned, '未割り当て')}</div>
                <div class="col-lg-2 d-grid align-content-center gap-3 px-lg-4"><button class="btn btn-outline-secondary" type="button" onclick="moveUsers('unassignedUsers','assignedUsers')">→</button><button class="btn btn-outline-secondary" type="button" onclick="moveUsers('assignedUsers','unassignedUsers')">←</button></div>
                <div class="col-lg-5">${userSelectTable('assignedUsers', assigned, '割り当て済み')}</div>
              </div>
              <div class="d-flex justify-content-between mt-4"><button class="btn btn-outline-secondary action-btn" type="button" onclick="closeModal()">キャンセル</button><button class="btn btn-primary action-btn" onclick="syncAssignedUsers()">保存</button></div>
            `, 'admin-form-full')}
          </div>
        `);
      }

      function openWageModal(userId) {
        const user = snapshot.activeUsers.find(item => String(item.id) === String(userId));
        const upgrades = {};
        snapshot.wageUpgrades.filter(item => String(item.userId) === String(userId)).forEach(item => upgrades[String(item.projectId)] = item.increment);
        const rows = snapshot.projects.map(project => `
          <tr><td>${esc(projectLabel(project))}</td><td><input class="form-control form-control-sm wage-input" data-project-id="${esc(project.id)}" type="number" value="${esc(upgrades[String(project.id)] || 0)}"></td></tr>
        `).join('');
        openModal(`
          <div class="modal-body-balanced">
            <h5 class="modal-title-lite">${esc(user.name || user.id)}さんの時給増分</h5>
            ${postForm(`
              <input type="hidden" name="action" value="updateWageUpgrades">
              <input type="hidden" name="userId" value="${esc(userId)}">
              <input type="hidden" id="wageProjectIds" name="projectIds">
              <input type="hidden" id="wageIncrements" name="increments">
              <div class="table-responsive"><table class="table table-sm admin-table"><thead><tr><th>対象PJ</th><th>時給増分</th></tr></thead><tbody>${rows}</tbody></table></div>
              <div class="d-flex justify-content-between mt-4"><button class="btn btn-outline-secondary action-btn" type="button" onclick="closeModal()">キャンセル</button><button class="btn btn-primary action-btn" onclick="syncWageInputs()">保存</button></div>
            `, 'admin-form-full')}
          </div>
        `);
      }

      function openUserNameModal(userId) {
        const user = snapshot.activeUsers.find(item => String(item.id) === String(userId));
        if (!user) return;
        openModal(`
          <div class="modal-body-form">
            <h5 class="modal-title-lite">${esc(userLabel(user) || user.id)}の名前編集</h5>
            ${postForm(`
              <input type="hidden" name="action" value="updateUserName">
              <input type="hidden" name="userId" value="${esc(user.id)}">
              <div class="mb-3">
                <label class="form-label">名前</label>
                <input class="form-control" name="name" value="${esc(user.name || '')}" maxlength="100">
              </div>
              <div class="d-flex justify-content-between mt-4"><button class="btn btn-outline-secondary action-btn" type="button" onclick="closeModal()">キャンセル</button><button class="btn btn-primary action-btn">保存</button></div>
            `, 'admin-form-full')}
          </div>
        `);
      }

      function openRoleModal(id) {
        const row = snapshot.roleAllowances.find(item => String(item.id) === String(id));
        openModal(`
          <div class="modal-body-form">
            <h5 class="modal-title-lite">役職手当編集</h5>
            ${postForm(`
              <input type="hidden" name="action" value="updateRoleAllowance">
              <input type="hidden" name="allowanceId" value="${esc(row.id)}">
              <div class="row g-3 justify-content-center">
                ${input('allowanceName','手当名','text', row.name, 'col-md-5')}
                ${userSelect('userId', row.userId, '対象ユーザー', 'col-md-7')}
                ${input('price','単価','number', row.price, 'col-md-5')}
              </div>
              <div class="d-flex justify-content-between mt-4"><button class="btn btn-outline-secondary action-btn" type="button" onclick="closeModal()">キャンセル</button><button class="btn btn-primary action-btn">保存</button></div>
            `, 'admin-form-full')}
          </div>
        `);
      }

      function userSelectTable(id, users, title) {
        return `<div class="transfer-pane border rounded p-2"><h6>${title}</h6><table class="table table-sm"><tbody id="${id}">${users.map(user => `<tr data-user-id="${esc(user.id)}"><td><input type="checkbox"></td><td>${esc(userLabel(user))}</td></tr>`).join('')}</tbody></table></div>`;
      }

      function moveUsers(fromId, toId) {
        const from = document.getElementById(fromId);
        const to = document.getElementById(toId);
        Array.from(from.querySelectorAll('tr')).filter(row => row.querySelector('input').checked).forEach(row => {
          row.querySelector('input').checked = false;
          to.appendChild(row);
        });
      }
      function syncAssignedUsers() {
        const assignedIds = Array.from(document.querySelectorAll('#assignedUsers tr')).map(row => row.dataset.userId);
        document.getElementById('assignedUserIds').value = normalizeAssignedUserIds(assignedIds);
      }
      function syncWageInputs() {
        const inputs = Array.from(document.querySelectorAll('.wage-input'));
        document.getElementById('wageProjectIds').value = inputs.map(input => input.dataset.projectId).join(',');
        document.getElementById('wageIncrements').value = inputs.map(input => input.value || 0).join(',');
      }
      function openModal(body) {
        modal.innerHTML = `<div class="modal-panel">${body}</div>`;
        modal.classList.add('is-open');
      }
      function closeModal() {
        modal.classList.remove('is-open');
        modal.innerHTML = '';
      }
